name: Daily Fresher Job Discovery Agent

on:
  schedule:
    # 03:00 UTC corresponds to 08:30 AM India Standard Time (IST)
    # Note: GitHub Actions scheduled events may experience queue delays
    # under GitHub's shared runner scheduling policies.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (discovers & scores without sending Telegram alerts)'
        required: false
        type: boolean
        default: false
      test_telegram:
        description: 'Send a test message to Telegram to verify bot credentials'
        required: false
        type: boolean
        default: false

concurrency:
  group: daily-fresher-agent-run
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-agent:
    name: Execute Daily Job Discovery & Alerting
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        env:
          DATABASE_PATH: data/test_cache.db
        run: |
          pytest --strict-markers -v

      - name: Verify Configuration
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEARCH_PROVIDER: ${{ vars.SEARCH_PROVIDER || 'ats_direct' }}
          SEARCH_API_KEY: ${{ secrets.SEARCH_API_KEY }}
          SEARCH_ENGINE_ID: ${{ secrets.SEARCH_ENGINE_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATABASE_PATH: data/jobs_cache.db
        run: |
          python main.py --check-config

      - name: Send Test Telegram Message (Optional Dispatch)
        if: ${{ inputs.test_telegram == true }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py --test-telegram

      - name: Execute Autonomous Job Discovery Run
        if: ${{ inputs.test_telegram != true }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEARCH_PROVIDER: ${{ vars.SEARCH_PROVIDER || 'ats_direct' }}
          SEARCH_API_KEY: ${{ secrets.SEARCH_API_KEY }}
          SEARCH_ENGINE_ID: ${{ secrets.SEARCH_ENGINE_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATABASE_PATH: data/jobs_cache.db
          SEND_EMPTY_REPORT: "true"
          MIN_RELEVANCE_SCORE: "60"
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python main.py --dry-run
          else
            python main.py --once
          fi

      - name: Safely Persist Database Cache State
        if: ${{ !cancelled() && inputs.dry_run != true && inputs.test_telegram != true }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage only the jobs database cache file if modified
          if [ -f data/jobs_cache.db ]; then
            git add -f data/jobs_cache.db
            if git diff --staged --quiet; then
              echo "No database changes to commit."
            else
              git commit -m "chore(cache): update persistent jobs cache [skip ci]"
              git pull --rebase origin main || true
              git push origin main
              echo "Persistent database state saved successfully."
            fi
          fi

      - name: Upload Execution Diagnostics Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-diagnostics
          path: |
            data/jobs_cache.db
          if-no-files-found: ignore
          retention-days: 7
